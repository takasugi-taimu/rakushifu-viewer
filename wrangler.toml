name = "rakushifu-viewer"
main = "src/worker.py"
base_dir = "src"
compatibility_date = "2026-09-30"
compatibility_flags = ["python_workers"]

[python_modules]
exclude = ["**/*.pyc", "**/__pycache__"]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "SessionObject"

[[durable_objects.bindings]]
name = "LOGIN_LIMITS"
class_name = "LoginLimitObject"

[exports.SessionObject]
type = "durable-object"
storage = "sqlite"

[exports.LoginLimitObject]
type = "durable-object"
storage = "sqlite"
